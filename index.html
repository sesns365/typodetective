<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
    <meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>錯字搜查隊</title>
<style>
:root{
  color-scheme:light only;
  --bg:#f5f8f7; --panel:#ffffff; --ink:#173336; --muted:#557074; --line:#d6e3e1;
  --brand:#198a86; --brand-dark:#12615f; --brand-soft:#e3f3f1;
  --nani:#2f7fc1; --nani-soft:#e6f0fa;
  --kang:#e0812b; --kang-soft:#fdf0e3;
  --han:#3d9a54; --han-soft:#e6f4e9;
  --shadow:0 12px 30px rgba(21,72,77,.12);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,rgba(25,138,134,.10),transparent 300px),var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif}
button,input,a{font:inherit}
main{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:24px 0 48px}

header{position:relative;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-right:80px;margin-bottom:20px}
h1{margin:0;font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.15;letter-spacing:.02em;color:var(--brand-dark)}
.subtitle{margin:10px 0 0;color:var(--muted);font-size:1.08rem;line-height:1.8}
.se365-logo{position:absolute;top:0;right:0;width:64px;height:64px;opacity:.85;pointer-events:none}

.zy-toggle{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:6px 8px 6px 18px;border:2px solid var(--line);border-radius:999px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;font-weight:800;font-size:1.15rem;color:var(--ink)}
.zy-toggle:hover{border-color:var(--brand)}
.switch{position:relative;width:62px;height:36px;border-radius:999px;background:#cfdcda;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.zy-toggle[aria-pressed="true"] .switch{background:var(--brand)}
.zy-toggle[aria-pressed="true"] .switch::after{transform:translateX(26px)}
.zy-toggle .state{min-width:1.6em;color:var(--brand-dark)}

.panel{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.step-label{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.15rem;font-weight:800;color:var(--muted)}
.step-no{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:1rem}

.versions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ver{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 20px;border:3px solid var(--line);border-radius:14px;background:#fbfdfc;color:var(--ink);cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,background .15s}
.ver:hover{transform:translateY(-2px)}
.ver .ver-name{font-size:1.7rem;font-weight:900;line-height:1.3}
.ver .ver-count{color:var(--muted);font-weight:700}
.ver[data-v="南一"]{--c:var(--nani);--cs:var(--nani-soft)}
.ver[data-v="康軒"]{--c:var(--kang);--cs:var(--kang-soft)}
.ver[data-v="翰林"]{--c:var(--han);--cs:var(--han-soft)}
.ver .ver-name{color:var(--c)}
.ver[aria-pressed="true"]{border-color:var(--c);background:var(--cs)}
.ver[aria-pressed="true"]::after{content:"✓";position:absolute;top:12px;right:14px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:900}

.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 18px;border:2px solid var(--line);border-radius:10px;background:#f8fbfa;color:var(--ink);cursor:pointer;font-weight:800;font-size:1.1rem;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
.search{width:100%;min-height:50px;padding:0 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:1.1rem}
.chip:focus-visible,.search:focus-visible,.ver:focus-visible,.zy-toggle:focus-visible,.btn:focus-visible{outline:3px solid rgba(25,138,134,.35);outline-offset:2px}

.summary{display:flex;align-items:center;gap:10px;margin:26px 4px 12px;color:var(--muted);font-weight:800;font-size:1.15rem}.summary small{font-size:.9rem;font-weight:700;opacity:.8}
.groups{display:grid;gap:18px}
.group{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.9)}
.group-title{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;font-size:1.5rem}
.group-title small{color:var(--muted);font-size:1rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-left:6px solid var(--vc,var(--brand));border-radius:12px;background:#fff;box-shadow:0 6px 16px rgba(21,72,77,.07)}
.card-no{color:var(--vc,var(--brand));font-weight:800;font-size:.98rem}
.card-title{margin:0;font-size:1.3rem;font-weight:900;line-height:1.5;overflow-wrap:anywhere;flex:1}
.card-actions{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.pick{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-weight:800;cursor:pointer;user-select:none;white-space:nowrap}
.pick input{width:22px;height:22px;margin:0;accent-color:var(--brand);cursor:pointer}
.pick:hover{border-color:var(--brand)}
.card.picked{border-color:var(--brand);background:var(--brand-soft)}
.card.picked .pick{border-color:var(--brand);color:var(--brand-dark)}
.dlbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:55;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:min(860px,calc(100% - 32px));padding:10px 12px;border:2px solid var(--brand);border-radius:16px;background:rgba(255,255,255,.97);box-shadow:0 14px 34px rgba(21,72,77,.22)}
.dlbar .count{margin-right:auto;font-weight:900;color:var(--brand-dark);font-size:1.1rem;padding-left:4px}
.dlbar .btn{min-height:44px;padding:4px 14px}
.btn-ghost{background:#fff;color:var(--brand-dark)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-dl{background:var(--kang);border-color:var(--kang);color:#fff}
.btn-dl:hover{filter:brightness(.95)}
body.mode-ws main{padding-bottom:120px}
.dlbar[hidden]{display:none}
.modes{display:flex;gap:8px;margin:0 0 14px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);width:fit-content;max-width:100%}
.mode{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:10px;color:var(--muted);font-weight:900;font-size:1.15rem;text-decoration:none}
.mode:hover{background:var(--brand-soft);color:var(--brand-dark)}
.mode[aria-current="page"]{background:var(--brand);color:#fff}
.ws-hint{display:none;margin:0 4px 14px;color:var(--brand-dark);font-weight:700;line-height:1.8}
body.mode-ws .ws-hint{display:block}
.card-link{text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.card-link:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(21,72,77,.14)}
.card-link .btn-go{width:100%}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.ws-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;border:2px solid var(--line);border-left:6px solid var(--vc,var(--brand));border-radius:10px;background:#fff;cursor:pointer;user-select:none}
.ws-row:hover{border-color:var(--brand)}
.ws-row.picked{border-color:var(--brand);background:var(--brand-soft)}
.ws-row input{flex:0 0 auto;width:22px;height:22px;margin:0;accent-color:var(--brand);color-scheme:light;cursor:pointer}
.ws-no{flex:0 0 auto;color:var(--vc,var(--brand));font-weight:800;font-size:.95rem}
.ws-title{font-weight:800;font-size:1.12rem;line-height:1.5;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:4px 8px;border-radius:10px;border:2px solid var(--brand);font-weight:800;font-size:1rem;text-decoration:none;cursor:pointer;text-align:center;line-height:1.3}
.btn-go{background:var(--brand);color:#fff}
.btn-go:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn[disabled]{opacity:.6;cursor:wait}
.empty{padding:30px;border:2px dashed var(--line);border-radius:14px;background:#fff;color:var(--muted);text-align:center;font-weight:800;font-size:1.1rem}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.95rem}
footer a{color:var(--brand-dark);font-weight:800}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);padding:12px 20px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 逐字注音（右側直式） */
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .04em;line-height:1}
.zb{display:inline-block;line-height:1.15}
.zy{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1em;margin-left:.12em;margin-right:.75em;font-size:.4em;font-weight:500;line-height:1;letter-spacing:0}
.zy>i{display:block;font-style:normal;width:1em;height:1em;text-align:center}
.zy>.zn{height:.7em;line-height:.7em}
.zy>.zt{position:absolute;right:-.8em;width:.8em;height:auto;font-size:1em}
.zy-on .card-title,.zy-on h1{line-height:1.6}
.zy-on .card-actions{grid-template-columns:1fr}
@media (max-width:640px){.dlbar .count{width:100%;margin:0;text-align:center}.dlbar .btn{flex:1 1 auto}}
.zy-on .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

@media (max-width:820px){
  .row2{grid-template-columns:1fr}
}
@media (max-width:640px){
  main{width:calc(100% - 32px);padding-top:16px}
  header{padding-right:56px}
  .se365-logo{width:46px;height:46px}
  .versions{grid-template-columns:1fr}
  .ver{flex-direction:row;align-items:center;justify-content:space-between;padding:14px 56px 14px 16px}
  .ver .ver-name{font-size:1.4rem}
  .ver[aria-pressed="true"]::after{top:50%;transform:translateY(-50%)}
  .chip{flex:1 1 72px;padding:0 10px}
  .grid{grid-template-columns:1fr}
}
.vtag{display:inline-block;margin-right:.5em;padding:.1em .6em;border-radius:999px;background:var(--vc);color:#fff;font-size:.8em;vertical-align:middle}
body.searching #versions,body.searching #grades{opacity:.45}
.search-panel{margin-bottom:16px}
.search-ico{width:26px;height:26px;fill:none;stroke:var(--brand);stroke-width:2.6;stroke-linecap:round}
.search-panel .search{min-height:56px;font-size:1.2rem}
</style>
</head>

  const VORDER = ["南一","康軒","翰林"];
  const list = (q
      ? LESSONS.filter(x=>x.title.includes(q) || x.code.includes(q))
      : LESSONS.filter(x=>x.version===state.v).filter(x=>state.g==="全部"||x.grade===state.g))
    .sort((a,b)=>VORDER.indexOf(a.version)-VORDER.indexOf(b.version)||GRADES.indexOf(a.grade)-GRADES.indexOf(b.grade)||lessonNo(a)-lessonNo(b));
  document.body.classList.toggle("searching", !!q);
  document.getElementById("summary").innerHTML = '<span class="step-no">3</span><span>'+T("選課次")+'</span><small>'+(q ? T("搜尋全部版本與年級") : T(state.v+"版")+(state.g==="全部"?"":" "+T(GRADE_NAME[state.g])))+'</small>';
  const box = document.getElementById("groups");
  if(!list.length){ box.innerHTML = '<div class="empty">'+T("找不到符合的課文")+'</div>'; state.visible = []; renderBar(); return; }
  const byGrade = new Map();
  list.forEach(x=>{ const k = x.version+"|"+x.grade; if(!byGrade.has(k)) byGrade.set(k,[]); byGrade.get(k).push(x); });
  box.innerHTML = Array.from(byGrade.entries()).map(([k,items])=>{ const [v,g] = k.split("|"); return (
    '<section class="group"><h2 class="group-title">'+(q?'<span class="vtag" style="--vc:'+VCOLOR[v]+'">'+T(v+"版")+'</span>':'')+T(GRADE_NAME[g])+'</h2><div class="'+(state.mode==="ws"?'ws-grid':'grid')+'">'+
    items.map(x=>{
      const i = LESSONS.indexOf(x);
      const on = state.sel.has(i);
      if(state.mode==="ws"){
        return '<label class="ws-row'+(on?' picked':'')+'" style="--vc:'+VCOLOR[x.version]+'">'+
          '<input type="checkbox" data-pick="'+i+'"'+(on?' checked':'')+'>'+
          '<span class="ws-no">'+T("第")+' '+lessonNo(x)+' '+T("課")+'</span>'+
          '<span class="ws-title">'+T(x.title)+'</span></label>';
      }
      return '<a class="card card-link" href="'+lessonHref(x)+'" style="--vc:'+VCOLOR[x.version]+'">'+
        '<div class="card-no">'+T("第")+' '+lessonNo(x)+' '+T("課")+'</div>'+
        '<h3 class="card-title">'+T(x.title)+'</h3>'+
        '<span class="btn btn-go">'+T("進入練習")+'</span></a>';
    }).join("")+'</div></section>'); }).join("");
  box.querySelectorAll("[data-pick]").forEach(c=>c.onchange=()=>{
    const i = +c.dataset.pick;
    if(c.checked) state.sel.add(i); else state.sel.delete(i);
    c.closest(".ws-row").classList.toggle("picked", c.checked);
    renderBar();
  });
  state.visible = list.map(x=>LESSONS.indexOf(x));
  renderBar();
}
function renderMode(){
  document.getElementById("modePlay").setAttribute("aria-current", state.mode==="play"?"page":"false");
  document.getElementById("modeWs").setAttribute("aria-current", state.mode==="ws"?"page":"false");
  document.body.classList.toggle("mode-ws", state.mode==="ws");
}
function renderAll(){ renderStatic(); renderMode(); renderVersions(); renderGrades(); renderLessons(); }
window.addEventListener("hashchange", ()=>{ state.mode = location.hash==="#worksheet" ? "ws" : "play"; renderAll(); window.scrollTo({top:0}); });

function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(()=>t.classList.remove("show"), 2600);
}
function renderBar(){
  const bar = document.getElementById("dlbar");
  bar.hidden = state.mode!=="ws";
  if(bar.hidden) return;
  const n = state.sel.size;
  const vis = state.visible || [];
  const allOn = vis.length > 0 && vis.every(i=>state.sel.has(i));
  if(state.busy){
    bar.innerHTML = '<span class="count">'+esc(state.busy)+'</span>';
    return;
  }
  bar.innerHTML =
    '<span class="count">'+T("已勾選")+' '+n+' '+T("課")+'</span>'+
    '<button class="btn btn-ghost" type="button" id="selAll"'+(vis.length?'':' disabled')+'>'+T(allOn?"取消全選":"全選這頁")+'</button>'+
    (n?'<button class="btn btn-ghost" type="button" id="selClear">'+T("清除")+'</button>':'')+
    '<button class="btn btn-dl" type="button" id="selDl"'+(n?'':' disabled')+'>'+T("下載學習單")+'</button>';
  document.getElementById("selAll").onclick = ()=>{
    if(allOn) vis.forEach(i=>state.sel.delete(i)); else vis.forEach(i=>state.sel.add(i));
    renderLessons();
  };
  const c = document.getElementById("selClear"); if(c) c.onclick = ()=>{ state.sel.clear(); renderLessons(); };
  document.getElementById("selDl").onclick = downloadSelected;
}

function fetchWorksheet(x){
  return new Promise(resolve=>{
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;width:1px;height:1px;left:-9999px;top:0;border:0;opacity:0";
    frame.setAttribute("aria-hidden","true");
    let done = false;
    function onMsg(e){
      if(e.source!==frame.contentWindow || !e.data) return;
      if(e.data.type==="typoSquadWorksheetBlob") finish({name:e.data.name, blob:e.data.blob});
    }
    function finish(r){ if(done) return; done = true; window.removeEventListener("message", onMsg); setTimeout(()=>frame.remove(), 500); resolve(r); }
    window.addEventListener("message", onMsg);
    setTimeout(()=>finish(null), 20000);
    frame.src = lessonHref(x, "worksheet=1&collect=1");
    document.body.appendChild(frame);
  });
}
async function saveBlob(blob, name){
  if(window.claude && typeof window.claude.use === "function"){
    const dl = await window.claude.use("downloads");
    if(dl){ try{ await dl.save({filename:name, data:blob}); }catch(e){ if(e && e.code!=="declined") throw e; } return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
async function downloadSelected(){
  const items = Array.from(state.sel).sort((a,b)=>a-b).map(i=>LESSONS[i]);
  if(!items.length){ toast("請先勾選要下載的課"); return; }
  const results = []; const failed = [];
  for(let k=0;k<items.length;k++){
    state.busy = "正在製作學習單 "+(k+1)+" / "+items.length+"：「"+items[k].title+"」";
    renderBar();
    const r = await fetchWorksheet(items[k]);
    if(r && r.blob) results.push(r); else failed.push(items[k].title);
  }
  try{
    const inClaude = !!(window.claude && typeof window.claude.use === "function");
    if(results.length===1 && !inClaude){
      await saveBlob(results[0].blob, results[0].name);
    }else if(results.length>=1){
      state.busy = "正在打包 "+results.length+" 份學習單…"; renderBar();
      const zip = new JSZip(); const used = {};
      results.forEach(r=>{ let n = r.name; if(used[n]){ used[n]++; n = n.replace(/\.doc$/, "_"+used[n]+".doc"); } else used[n]=1; zip.file(n, r.blob); });
      const out = await zip.generateAsync({type:"blob"});
      await saveBlob(out, "錯字搜查隊學習單_"+results.length+"課.zip");
    }
  }catch(e){ failed.push("打包失敗"); }
  state.busy = "";
  renderBar();
  if(failed.length) toast("有 "+failed.length+" 課沒有下載成功："+failed.join("、"));
  else toast("已下載 "+results.length+" 份學習單");
}

document.getElementById("zyToggle").onclick = ()=>{ state.zy = !state.zy; save(); renderAll(); };
document.getElementById("search").addEventListener("input", e=>{ state.q = e.target.value; renderLessons(); });
renderAll();
</script>
